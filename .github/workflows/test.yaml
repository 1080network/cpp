name: Test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install gRPC and protobuf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc openssl
      - name: Install gRPC and protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install grpc protobuf cmake
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
